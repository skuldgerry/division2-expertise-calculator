name: Validate calculator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build GitHub Pages export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /division2-expertise-calculator
          NEXT_PUBLIC_SITE_URL: https://skuldgerry.github.io/division2-expertise-calculator
        run: npm run build

      - name: Check exported page
        run: test -s dist/client/index.html
