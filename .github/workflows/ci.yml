name: Validate calculator

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Verify migration generation
        run: |
          migration_dir="$(mktemp -d)"
          npm run db:generate -- --dialect sqlite --schema ./examples/d1/db/schema.ts --out "$migration_dir"
          test -n "$(find "$migration_dir" -name '*.sql' -size +0c -print -quit)"

      - name: Build GitHub Pages export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /division2-expertise-calculator
          NEXT_PUBLIC_SITE_URL: https://skuldgerry.github.io/division2-expertise-calculator
        run: npm run build

      - name: Check exported page
        run: test -s dist/client/index.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test exported calculator in Chromium
        run: |
          ln -s client dist/division2-expertise-calculator
          npm run test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
